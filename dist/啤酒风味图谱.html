<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>啤酒风味图谱 · Beer Flavor Atlas</title>
<meta name="description" content="基于 250 款商业啤酒、226 项化学指标与 50 维感官的风格风味图谱：风格查询、化合物交互、口味生成、风格溯源与跨风格迁移。">

<style>
/* ============================================================
   啤酒风味图谱 · Beer Flavor Atlas
   设计系统：深色酒厂实验室 / 暖琥珀 + 奶油纸色
   ============================================================ */

:root {
  --bg: #0e0c0a;
  --bg-soft: #141110;
  --panel: #191613;
  --panel-2: #1f1b17;
  --panel-3: #251f1a;
  --line: rgba(236, 223, 203, 0.10);
  --line-2: rgba(236, 223, 203, 0.18);
  --ink: #f4ecdd;
  --ink-2: #d9cdb9;
  --muted: #a2957f;
  --muted-2: #7d7365;
  --amber: #e9a94e;
  --amber-2: #f6cd85;
  --amber-dim: rgba(233, 169, 78, 0.14);
  --hop: #86ab8e;
  --copper: #cf8452;
  --rose: #d08496;
  --lilac: #a98bc0;
  --slate: #8b99a7;
  --red: #c85a45;
  --green: #6f9d7c;

  --r-s: 8px;
  --r-m: 14px;
  --r-l: 20px;
  --font-ui: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei",
    system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Iowan Old Style", "Palatino Linotype", "Georgia", "Times New Roman", serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", "Consolas", monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background:
    radial-gradient(1100px 620px at 88% -8%, rgba(233, 169, 78, 0.11), transparent 62%),
    radial-gradient(760px 520px at 4% 106%, rgba(134, 171, 142, 0.07), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(233, 169, 78, 0.28); color: #fff; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }

.shell {
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------------- 侧栏 ---------------- */
.rail {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  padding: 26px 20px 22px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 26px;
  background: linear-gradient(180deg, rgba(25, 22, 19, 0.72), rgba(14, 12, 10, 0.4));
  backdrop-filter: blur(6px);
  z-index: 20;
}

.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 38px; height: 38px; flex: none;
  color: var(--amber);
  border: 1px solid rgba(233, 169, 78, 0.34);
  border-radius: 11px;
  display: grid; place-items: center;
  background: rgba(233, 169, 78, 0.07);
}
.brand-mark svg { width: 27px; height: 27px; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
.brand-txt strong { font-size: 15.5px; letter-spacing: 0.06em; font-weight: 600; }
.brand-txt em {
  font-family: var(--font-num);
  font-style: italic;
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: baseline;
  padding: 9px 10px 9px 13px;
  border-radius: 10px;
  color: var(--muted);
  transition: background 0.18s ease, color 0.18s ease;
}
.nav-item::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 2px; height: 0;
  background: var(--amber);
  border-radius: 2px;
  transform: translateY(-50%);
  transition: height 0.22s ease;
}
.nav-item:hover { color: var(--ink-2); background: rgba(236, 223, 203, 0.04); }
.nav-item.is-on { color: var(--ink); background: rgba(233, 169, 78, 0.08); }
.nav-item.is-on::before { height: 22px; }
.nav-no {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--muted-2);
  padding-top: 1px;
}
.nav-item.is-on .nav-no { color: var(--amber); }
.nav-lab { display: flex; flex-direction: column; line-height: 1.35; }
.nav-lab b { font-weight: 500; font-size: 13.5px; letter-spacing: 0.03em; }
.nav-lab i {
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.nav-item.is-on .nav-lab i { color: rgba(233, 169, 78, 0.75); }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.rail-stat {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 10px 2px;
  font-size: 11px;
  color: var(--muted);
}
.rail-stat b {
  font-family: var(--font-num);
  font-size: 15px;
  color: var(--amber-2);
  font-weight: 500;
  margin-right: 3px;
}
.rail-foot p {
  margin: 0;
  font-size: 10.5px;
  line-height: 1.65;
  color: var(--muted-2);
}
.link-btn {
  text-align: left;
  font-size: 11px;
  color: var(--amber);
  padding: 0;
  letter-spacing: 0.03em;
}
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------------- 主区 ---------------- */
.main {
  min-width: 0;
  padding: 0 42px 80px;
  max-width: 1440px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 0 13px;
  margin-bottom: 26px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(14, 12, 10, 0.94) 62%, rgba(14, 12, 10, 0));
  backdrop-filter: blur(8px);
}
.crumb { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.crumb-k { color: var(--muted-2); letter-spacing: 0.08em; }
.crumb-v { color: var(--ink-2); font-weight: 500; letter-spacing: 0.02em; }
.crumb-v::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--amber);
  margin-right: 8px;
  vertical-align: 2px;
}
.topbar-actions { display: flex; gap: 8px; }
.ghost-btn {
  padding: 5px 12px;
  border: 1px solid var(--line-2);
  border-radius: 100px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.03em;
  transition: all 0.18s ease;
}
.ghost-btn:hover { color: var(--ink); border-color: rgba(233, 169, 78, 0.45); background: rgba(233, 169, 78, 0.07); }

.view { display: none; animation: rise 0.42s cubic-bezier(0.22, 0.8, 0.3, 1) both; }
.view.is-on { display: block; }
@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}

/* ---------------- 页头 ---------------- */
.view-head { margin-bottom: 26px; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 12px;
}
.eyebrow::after {
  content: "";
  height: 1px;
  width: 46px;
  background: linear-gradient(90deg, rgba(233, 169, 78, 0.6), transparent);
}
h1 {
  margin: 0 0 12px;
  font-size: clamp(26px, 3vw, 38px);
  line-height: 1.24;
  font-weight: 600;
  letter-spacing: 0.01em;
}
h1 em {
  font-family: var(--font-num);
  font-style: italic;
  font-weight: 400;
  color: var(--amber-2);
  letter-spacing: 0;
  margin-left: 0.28em;
  font-size: 0.82em;
}
.lede {
  margin: 0;
  max-width: 720px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--muted);
}
.lede b { color: var(--ink-2); font-weight: 500; }

.h2 {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.h2 small {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.h3 {
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-2);
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: linear-gradient(168deg, rgba(31, 27, 23, 0.9), rgba(22, 19, 16, 0.72));
  padding: 18px 20px;
}
.panel + .panel { margin-top: 16px; }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.panel-head .h2 { margin: 0; }
.panel-note { font-size: 11px; color: var(--muted-2); }

/* ---------------- 工具栏 / 搜索 ---------------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.search {
  position: relative;
  flex: 1 1 240px;
  max-width: 340px;
}
.search input {
  width: 100%;
  padding: 9px 14px 9px 34px;
  background: rgba(236, 223, 203, 0.04);
  border: 1px solid var(--line-2);
  border-radius: 100px;
  color: var(--ink);
  font-size: 12.5px;
  letter-spacing: 0.02em;
  outline: none;
  transition: border 0.18s ease, background 0.18s ease;
}
.search input::placeholder { color: var(--muted-2); }
.search input:focus { border-color: rgba(233, 169, 78, 0.55); background: rgba(233, 169, 78, 0.06); }
.search svg {
  position: absolute;
  left: 12px; top: 50%;
  width: 13px; height: 13px;
  transform: translateY(-50%);
  color: var(--muted-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 12px;
  border: 1px solid var(--line-2);
  border-radius: 100px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.03em;
  transition: all 0.16s ease;
  white-space: nowrap;
}
.chip:hover { color: var(--ink-2); border-color: var(--line-2); background: rgba(236, 223, 203, 0.05); }
.chip.is-on {
  color: #1a1409;
  background: var(--amber);
  border-color: var(--amber);
  font-weight: 500;
}
.chip-count { opacity: 0.55; margin-left: 4px; font-family: var(--font-mono); font-size: 10px; }

/* ---------------- 风格卡片 ---------------- */
.grid-styles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
  gap: 12px;
}
.s-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px 15px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: linear-gradient(165deg, rgba(33, 28, 23, 0.86), rgba(21, 18, 15, 0.66));
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.s-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(220px 120px at 85% 0%, rgba(233, 169, 78, 0.13), transparent 70%);
  opacity: 0;
  transition: opacity 0.24s ease;
  pointer-events: none;
}
.s-card:hover { transform: translateY(-2px); border-color: rgba(233, 169, 78, 0.38); box-shadow: 0 14px 32px -22px rgba(0, 0, 0, 0.9); }
.s-card:hover::after { opacity: 1; }
.s-card.is-on { border-color: rgba(233, 169, 78, 0.6); background: linear-gradient(165deg, rgba(46, 37, 26, 0.9), rgba(26, 22, 18, 0.8)); }
.s-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.s-name { font-size: 14.5px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.35; }
.s-en {
  font-family: var(--font-num);
  font-style: italic;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.s-fam {
  flex: none;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted);
  border: 1px solid var(--line-2);
  padding: 2px 7px;
  border-radius: 100px;
}
.s-body { display: flex; align-items: center; gap: 12px; }
.s-radar { flex: none; }
.s-key { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.s-key span {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.s-key span i {
  display: inline-block;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--amber);
  margin-right: 6px;
  vertical-align: 2px;
  opacity: 0.8;
}
.s-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px dashed var(--line);
  padding-top: 9px;
  font-size: 10.5px;
  color: var(--muted-2);
  letter-spacing: 0.03em;
}
.s-foot b { color: var(--ink-2); font-weight: 500; font-family: var(--font-num); font-size: 12px; }

/* ---------------- 展开的详情 ---------------- */
.detail { margin-top: 22px; }
.d-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 18px;
  align-items: stretch;
}
.d-title { display: flex; flex-direction: column; gap: 10px; }
.d-title h2 {
  margin: 0;
  font-size: clamp(22px, 2.4vw, 30px);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.d-title h2 em {
  font-family: var(--font-num);
  font-style: italic;
  font-weight: 400;
  color: var(--amber-2);
  font-size: 0.72em;
  padding-left: 8px;
}
.d-desc { margin: 0; font-size: 13px; line-height: 1.9; color: var(--muted); max-width: 560px; }
.d-meta { display: flex; flex-wrap: wrap; gap: 7px; }
.tag {
  font-size: 10.5px;
  letter-spacing: 0.04em;
  padding: 3px 9px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  color: var(--muted);
}
.tag-amber { color: var(--amber-2); border-color: rgba(233, 169, 78, 0.34); background: rgba(233, 169, 78, 0.08); }
.tag-src { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; }

.radar-box {
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: radial-gradient(320px 220px at 50% 42%, rgba(233, 169, 78, 0.07), transparent 70%), rgba(20, 17, 14, 0.5);
  display: grid;
  place-items: center;
  padding: 8px;
}

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.metric {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(27, 23, 19, 0.6);
}
.metric-k { font-size: 10px; letter-spacing: 0.1em; color: var(--muted-2); text-transform: uppercase; }
.metric-v {
  font-family: var(--font-num);
  font-size: 21px;
  line-height: 1.25;
  color: var(--ink);
  margin-top: 3px;
}
.metric-v small { font-family: var(--font-ui); font-size: 10.5px; color: var(--muted); margin-left: 3px; }

/* ---------------- 表格 ---------------- */
.table { display: flex; flex-direction: column; }
.t-row {
  display: grid;
  grid-template-columns: minmax(140px, 1.2fr) 86px 210px 74px minmax(118px, 1fr);
  gap: 14px;
  align-items: center;
  padding: 12px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.t-row:last-child { border-bottom: 0; }
.t-head {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  border-bottom: 1px solid var(--line-2);
  padding-bottom: 8px;
  position: sticky;
  top: 56px;
  background: var(--bg);
  z-index: 2;
}
.t-c { min-width: 0; }
.t-name { display: flex; flex-direction: column; line-height: 1.4; }
.t-name b { font-weight: 500; font-size: 12.5px; color: var(--ink); }
.t-name i { font-style: normal; font-family: var(--font-num); font-size: 10.5px; color: var(--muted-2); }
.t-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.t-dim { font-size: 11px; color: var(--muted); }
.t-src { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-2); letter-spacing: 0.02em; }

.range { display: flex; flex-direction: column; gap: 4px; }
.range-track {
  position: relative;
  height: 6px;
  border-radius: 3px;
  background: rgba(236, 223, 203, 0.13);
  box-shadow: inset 0 0 0 1px rgba(236, 223, 203, 0.05);
  overflow: visible;
}
.range-fill {
  position: absolute;
  top: 0; bottom: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(233, 169, 78, 0.42), var(--amber));
}
.range-mid {
  position: absolute;
  top: -2px;
  width: 2px; height: 9px;
  background: var(--amber-2);
  border-radius: 1px;
  box-shadow: 0 0 6px rgba(246, 205, 133, 0.6);
}
.range-lab {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.range-lab b { color: var(--ink-2); font-weight: 500; }

.dir { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; }
.dir-up { color: var(--amber-2); }
.dir-down { color: var(--hop); }
.dir-flat { color: var(--muted-2); }

.attr-mini { display: flex; flex-wrap: wrap; gap: 3px; }
.attr-pill {
  font-size: 9.5px;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.attr-pill b { font-weight: 500; color: var(--ink-2); margin-left: 2px; }

/* ---------------- 指纹 ---------------- */
.fp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fp-col { display: flex; flex-direction: column; gap: 7px; }
.fp-cap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 2px;
}
.fp-cap::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.fp-cap.up { color: var(--amber); }
.fp-cap.down { color: var(--hop); }
.fp-item { display: grid; grid-template-columns: minmax(0, 1fr) 96px 36px; gap: 8px; align-items: center; font-size: 11.5px; }
.fp-item span:first-child { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-bar { height: 4px; border-radius: 2px; background: rgba(236, 223, 203, 0.07); position: relative; }
.fp-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; display: block; }
.fp-d { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: right; }

/* ---------------- 化合物实验室 ---------------- */
.lab {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.catalog { position: sticky; top: 66px; }
.cat-scroll { max-height: calc(100vh - 250px); overflow: auto; padding-right: 6px; }
.cat-scroll::-webkit-scrollbar { width: 5px; }
.cat-scroll::-webkit-scrollbar-thumb { background: rgba(236, 223, 203, 0.14); border-radius: 4px; }
.cat-group { margin-bottom: 14px; }
.cat-group-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  padding: 4px 2px 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 5px;
}
.cat-group-h i { font-style: normal; font-family: var(--font-mono); }
.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 6px 7px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--muted);
  transition: background 0.15s ease, color 0.15s ease;
}
.cat-item:hover { background: rgba(236, 223, 203, 0.05); color: var(--ink-2); }
.cat-item.is-on { background: rgba(233, 169, 78, 0.11); color: var(--ink); }
.cat-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
.cat-item span:not(.cat-dot) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-item i {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--muted-2);
}
.cat-item.is-on i { color: var(--amber); }

.lab-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.sel-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.sel-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px 4px 10px;
  border-radius: 100px;
  border: 1px solid rgba(233, 169, 78, 0.3);
  background: rgba(233, 169, 78, 0.08);
  font-size: 11.5px;
  color: var(--ink-2);
}
.sel-pill button { color: var(--muted-2); font-size: 13px; line-height: 1; padding: 0 1px; }
.sel-pill button:hover { color: var(--red); }
.empty-hint { font-size: 12px; color: var(--muted-2); padding: 8px 0; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

.attr-bars { display: flex; flex-direction: column; gap: 9px; }
.attr-row { display: grid; grid-template-columns: 70px 1fr 42px; gap: 10px; align-items: center; font-size: 11.5px; }
.attr-row .attr-name { color: var(--muted); }
.attr-track { height: 6px; border-radius: 3px; background: rgba(236, 223, 203, 0.07); position: relative; overflow: hidden; }
.attr-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; display: block; transition: width 0.45s cubic-bezier(0.2, 0.8, 0.3, 1); }
.attr-val { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); text-align: right; }

.impact-list { display: flex; flex-direction: column; gap: 2px; }
.impact-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 84px 54px;
  gap: 10px;
  align-items: center;
  padding: 7px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 11.5px;
}
.impact-row:last-child { border-bottom: 0; }
.impact-name { display: flex; flex-direction: column; line-height: 1.35; }
.impact-name b { font-weight: 500; color: var(--ink-2); font-size: 12px; }
.impact-name i { font-style: normal; font-size: 10px; color: var(--muted-2); }
.impact-bar { height: 5px; border-radius: 3px; background: rgba(236, 223, 203, 0.07); position: relative; }
.impact-bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.impact-bar i.pos { left: 50%; background: linear-gradient(90deg, rgba(233, 169, 78, 0.45), var(--amber)); }
.impact-bar i.neg { right: 50%; background: linear-gradient(270deg, rgba(134, 171, 142, 0.45), var(--hop)); }
.impact-bar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line-2); }
.impact-val { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); text-align: right; }

/* ---------------- 口味生成 ---------------- */
.note-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.65fr); gap: 18px; align-items: start; }
.note-card {
  position: relative;
  border: 1px solid rgba(236, 223, 203, 0.14);
  border-radius: var(--r-l);
  padding: 30px 34px 28px;
  background:
    radial-gradient(500px 260px at 88% 4%, rgba(233, 169, 78, 0.11), transparent 68%),
    linear-gradient(170deg, #1e1a16, #14110e);
  overflow: hidden;
}
.note-card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--amber), rgba(233, 169, 78, 0.05));
}
.note-kicker {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 18px;
}
.note-kicker b { color: var(--amber); font-weight: 500; }
.note-title {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.03em;
  margin: 0 0 4px;
}
.note-sub { font-family: var(--font-num); font-style: italic; font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.note-body { font-size: 14px; line-height: 2; color: var(--ink-2); letter-spacing: 0.015em; }
.note-body p { margin: 0 0 10px; }
.note-sec {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--amber);
  text-transform: uppercase;
  margin-right: 8px;
  font-family: var(--font-mono);
}
.hl {
  color: var(--amber-2);
  border-bottom: 1px dashed rgba(233, 169, 78, 0.5);
  cursor: help;
}
.hl:hover { background: rgba(233, 169, 78, 0.12); }
.note-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  font-size: 10.5px;
  color: var(--muted-2);
}
.note-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.solid-btn {
  padding: 7px 15px;
  border-radius: 100px;
  background: var(--amber);
  color: #1a1409;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  transition: filter 0.16s ease, transform 0.16s ease;
}
.solid-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.line-btn {
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  font-size: 11.5px;
  color: var(--muted);
  transition: all 0.16s ease;
}
.line-btn:hover { color: var(--ink); border-color: rgba(233, 169, 78, 0.45); }

.dom-list { display: flex; flex-direction: column; gap: 10px; }
.dom-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 44px; gap: 8px; align-items: baseline; }
.dom-rank { font-family: var(--font-num); font-size: 11px; color: var(--muted-2); }
.dom-name { font-size: 12.5px; color: var(--ink-2); }
.dom-name i { display: block; font-style: normal; font-size: 10.5px; color: var(--muted-2); line-height: 1.5; }
.dom-share { font-family: var(--font-mono); font-size: 10.5px; color: var(--amber); text-align: right; }
.dom-bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: rgba(236, 223, 203, 0.07); margin-top: 4px; }
.dom-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, rgba(233, 169, 78, 0.4), var(--amber)); }

.match-box { display: flex; align-items: center; gap: 14px; }
.match-num { font-family: var(--font-num); font-size: 34px; line-height: 1; color: var(--amber-2); }
.match-num small { font-size: 13px; color: var(--muted); margin-left: 2px; }
.match-txt { font-size: 11px; color: var(--muted); line-height: 1.6; }

/* ---------------- 溯源 ---------------- */
.origin-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr); gap: 18px; align-items: start; }
.stage-list { display: flex; flex-direction: column; }
.stage {
  position: relative;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 14px;
  padding: 0 0 22px;
}
.stage:last-child { padding-bottom: 0; }
.stage::before {
  content: "";
  position: absolute;
  left: 22px; top: 34px; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, rgba(233, 169, 78, 0.4), rgba(236, 223, 203, 0.08));
}
.stage:last-child::before { display: none; }
.stage-no {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(233, 169, 78, 0.35);
  background: radial-gradient(circle at 50% 30%, rgba(233, 169, 78, 0.22), rgba(20, 17, 14, 0.9));
  display: grid; place-items: center;
  font-family: var(--font-num);
  font-size: 15px;
  color: var(--amber-2);
  transition: all 0.2s ease;
}
.stage.is-on .stage-no { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(233, 169, 78, 0.1); }
.stage-body { padding-top: 3px; }
.stage-t {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  margin-bottom: 4px;
}
.stage-t span { font-family: var(--font-num); font-style: italic; font-size: 11px; color: var(--muted-2); font-weight: 400; }
.stage-d { font-size: 12px; line-height: 1.8; color: var(--muted); margin: 0 0 8px; }
.stage-ev { display: flex; flex-wrap: wrap; gap: 5px; }
.ev {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(236, 223, 203, 0.05);
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--font-mono);
}
.ev b { color: var(--amber-2); font-weight: 500; }
.ev.down b { color: var(--hop); }

.axis-plot { padding: 6px 2px 0; }
.axis-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 10.5px; color: var(--muted); margin-top: 8px; }
.axis-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

.flow3 { display: grid; grid-template-columns: 1fr 34px 1fr 34px 1fr; gap: 6px; align-items: stretch; }
.flow-col { display: flex; flex-direction: column; gap: 7px; }
.flow-h {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  border-bottom: 1px solid var(--line);
  padding-bottom: 5px;
  margin-bottom: 2px;
}
.flow-node {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 11.5px;
  color: var(--ink-2);
  background: rgba(28, 24, 20, 0.7);
  line-height: 1.5;
}
.flow-node span { display: block; font-size: 10px; color: var(--muted-2); }
.flow-arrow { display: grid; place-items: center; color: var(--muted-2); font-size: 15px; }

/* ---------------- 迁移 ---------------- */
.transfer-bar {
  display: grid;
  grid-template-columns: 1fr 44px 1fr;
  gap: 10px;
  align-items: end;
  margin-bottom: 18px;
}
.sel-field { display: flex; flex-direction: column; gap: 6px; }
.sel-field label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-2); }
.sel-field select {
  appearance: none;
  width: 100%;
  padding: 10px 32px 10px 13px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: rgba(31, 27, 23, 0.9) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23a2957f'/></svg>") no-repeat right 13px center;
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}
.sel-field select:focus { border-color: rgba(233, 169, 78, 0.55); }
.swap-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  color: var(--muted);
  font-size: 15px;
  transition: all 0.2s ease;
}
.swap-btn:hover { color: var(--amber); border-color: rgba(233, 169, 78, 0.5); transform: rotate(180deg); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
.kpi {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(27, 23, 19, 0.6);
}
.kpi-k { font-size: 10px; letter-spacing: 0.06em; color: var(--muted-2); }
.kpi-v { font-family: var(--font-num); font-size: 20px; color: var(--ink); margin-top: 2px; }
.kpi-v small { font-family: var(--font-ui); font-size: 10px; color: var(--muted); margin-left: 3px; }
.kpi-n { font-size: 10px; color: var(--muted-2); margin-top: 1px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 100px; background: rgba(236, 223, 203, 0.03); }
.seg button {
  padding: 5px 13px;
  border-radius: 100px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.02em;
  transition: all 0.16s ease;
}
.seg button.is-on { background: rgba(233, 169, 78, 0.16); color: var(--amber-2); }

.mig-row { grid-template-columns: minmax(120px, 1fr) 62px 150px 150px 58px; }
.mig-op {
  font-size: 9.5px;
  letter-spacing: 0.04em;
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid currentColor;
  display: inline-block;
  opacity: 0.9;
}
.op-add { color: var(--amber); }
.op-del { color: var(--hop); }
.op-up { color: var(--amber-2); }
.op-down { color: var(--slate); }

.path { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.path-step {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 10px 12px;
  background: linear-gradient(180deg, rgba(33, 28, 23, 0.8), rgba(20, 17, 14, 0.5));
  position: relative;
}
.path-step::after {
  content: "";
  position: absolute;
  right: -6px; top: 50%;
  width: 6px; height: 1px;
  background: var(--line-2);
}
.path-step:last-child::after { display: none; }
.path-pct { font-family: var(--font-mono); font-size: 10px; color: var(--amber); letter-spacing: 0.06em; }
.path-v { font-family: var(--font-num); font-size: 19px; color: var(--ink); margin: 3px 0 1px; }
.path-k { font-size: 10px; color: var(--muted-2); }
.path-bar { height: 3px; border-radius: 2px; background: rgba(236, 223, 203, 0.08); margin-top: 8px; }
.path-bar i { display: block; height: 100%; border-radius: 2px; background: var(--amber); }

.defect-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 54px; gap: 10px; align-items: center; font-size: 11.5px; padding: 6px 0; }
.defect-track { height: 7px; border-radius: 3px; background: rgba(236, 223, 203, 0.07); position: relative; }
.defect-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; display: block; }
.defect-track i.raw { background: rgba(200, 90, 69, 0.45); }
.defect-track i.cap { background: linear-gradient(90deg, rgba(111, 157, 124, 0.7), var(--green)); }
.defect-track b.lim { position: absolute; left: 38.46%; top: -3px; bottom: -3px; width: 1px; background: rgba(236, 223, 203, 0.55); }
.defect-track b.lim::after { content: "1.0"; position: absolute; left: 3px; top: -12px; font-family: var(--font-mono); font-size: 8px; color: var(--muted-2); }

.src-note {
  margin-top: 14px;
  padding: 10px 12px;
  border-left: 2px solid rgba(233, 169, 78, 0.4);
  background: rgba(233, 169, 78, 0.04);
  border-radius: 0 8px 8px 0;
  font-size: 11px;
  line-height: 1.75;
  color: var(--muted);
}
.src-note b { color: var(--ink-2); font-weight: 500; }

/* ---------------- 弹窗 ---------------- */
.modal { position: fixed; inset: 0; z-index: 100; display: none; }
.modal.is-on { display: block; }
.modal-veil { position: absolute; inset: 0; background: rgba(6, 5, 4, 0.72); backdrop-filter: blur(3px); }
.modal-card {
  position: relative;
  max-width: 780px;
  max-height: 84vh;
  overflow: auto;
  margin: 7vh auto;
  padding: 30px 34px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-l);
  background: linear-gradient(170deg, #201b17, #141110);
  box-shadow: 0 40px 90px -40px #000;
  animation: rise 0.3s ease both;
}
.modal-x {
  position: absolute;
  right: 16px; top: 14px;
  font-size: 20px;
  color: var(--muted-2);
  line-height: 1;
}
.modal-x:hover { color: var(--ink); }
.modal-card h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.02em; }
.modal-card h4 { margin: 20px 0 8px; font-size: 12px; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
.modal-card p { font-size: 12.5px; line-height: 1.9; color: var(--muted); margin: 0 0 8px; }
.modal-card table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.modal-card th, .modal-card td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.modal-card th { font-size: 10px; letter-spacing: 0.08em; color: var(--muted-2); text-transform: uppercase; font-weight: 500; }
.modal-card td { color: var(--ink-2); }
.modal-card td:first-child { color: var(--muted); white-space: nowrap; }

.tooltip {
  position: fixed;
  z-index: 200;
  pointer-events: none;
  padding: 6px 10px;
  border-radius: 7px;
  background: rgba(20, 17, 14, 0.97);
  border: 1px solid var(--line-2);
  font-size: 11px;
  color: var(--ink-2);
  line-height: 1.55;
  max-width: 260px;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease;
  box-shadow: 0 12px 30px -18px #000;
}
.tooltip.is-on { opacity: 1; transform: none; }

/* ---------------- 响应式 ---------------- */
@media (max-width: 1180px) {
  .shell { grid-template-columns: 232px minmax(0, 1fr); }
  .main { padding: 0 26px 70px; }
  .lab { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); }
  .t-row { grid-template-columns: minmax(120px, 1.1fr) 80px 180px 66px minmax(96px, 1fr); }
  .mig-row { grid-template-columns: minmax(110px, 1fr) 56px 130px 130px 52px; }
}

@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    position: sticky;
    top: 0;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    background: rgba(14, 12, 10, 0.94);
    overflow: hidden;
  }
  .brand-txt em { display: none; }
  .brand-txt strong { font-size: 13.5px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; }
  .brand-mark svg { width: 22px; height: 22px; }
  .nav { flex-direction: row; gap: 0; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-item { padding: 6px 10px; gap: 6px; white-space: nowrap; }
  .nav-item::before { display: none; }
  .nav-lab i { display: none; }
  .nav-lab b { font-size: 12.5px; }
  .nav-no { font-size: 9px; }
  .nav-item.is-on { background: rgba(233, 169, 78, 0.12); }
  .rail-foot { display: none; }
  .main { padding: 0 18px 60px; }
  .topbar { margin-bottom: 20px; padding: 11px 0 10px; }
  .topbar-actions .ghost-btn:first-child { display: none; }
  .d-hero { grid-template-columns: 1fr; }
  .radar-box { max-width: 420px; margin: 0 auto; width: 100%; }
  .lab { grid-template-columns: 1fr; }
  .catalog { position: static; }
  .cat-scroll { max-height: 300px; }
  .note-wrap { grid-template-columns: 1fr; }
  .origin-grid { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
  .t-row { grid-template-columns: minmax(120px, 1.4fr) 80px 1fr; row-gap: 6px; }
  .t-row > :nth-child(4) { display: none; }
  .t-head { display: none; }
  .mig-row { grid-template-columns: minmax(100px, 1.3fr) 54px 1fr 1fr; }
  .mig-row > :nth-child(5) { display: none; }
  .path { grid-template-columns: repeat(3, 1fr); }
  .metric-v { font-size: 18px; }
}

@media (max-width: 640px) {
  body { font-size: 13px; }
  h1 { font-size: 23px; }
  .main { padding: 0 13px 50px; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .grid-styles { grid-template-columns: 1fr; }
  .fp-grid { grid-template-columns: 1fr; }
  .flow3 { grid-template-columns: 1fr; }
  .flow-arrow { display: none; }
  .note-card { padding: 22px 20px; }
  .panel { padding: 14px; }

/* ---------------- 补充：表格内标签 ---------------- */
.fam-tag {

/* ---------------- 论文证据表 ---------------- */
.ev-panel { padding: 0; overflow: hidden; margin-top: 22px; }
.ev-panel > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;

  list-style: none;
}
.ev-panel > summary::-webkit-details-marker { display: none; }
.ev-panel > summary::after {
  content: "＋";
  color: var(--muted-2);
  font-size: 13px;
  order: 3;
  margin-left: 10px;
}
.ev-panel[open] > summary::after { content: "－"; }
.ev-panel[open] > summary { border-bottom: 1px solid var(--line); }
.ev-head, .ev-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.15fr) 1fr 1fr 1fr 52px;
  gap: 12px;
  align-items: center;
  padding: 8px 20px;
}
.ev-head {

}
.ev-row { border-bottom: 1px solid rgba(236, 223, 203, 0.05); font-size: 11.5px; }
.ev-row:hover { background: rgba(236, 223, 203, 0.03); }
.ev-row:last-child { border-bottom: 0; }
.ev-dim { display: flex; flex-direction: column; line-height: 1.4; }
.ev-dim b { font-weight: 500; color: var(--ink); font-size: 12px; }
.ev-dim span { font-family: var(--font-mono); font-size: 9px; color: var(--muted-2); }
.ev-c { display: flex; flex-direction: column; line-height: 1.4; min-width: 0; }
.ev-c b { font-weight: 400; color: var(--ink-2); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-c span { font-family: var(--font-mono); font-size: 9px; color: var(--muted-2); }
.ev-tier i {
  font-style: normal;
  font-size: 9.5px;
  padding: 2px 6px;
  border-radius: 3px;

}
.tier-1 { color: var(--amber); }
.tier-2 { color: var(--hop); }
.tier-3 { color: var(--muted-2); }

/* ---------------- 化合物卡片 ---------------- */
.cp-card {

.cp-conc { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; }

.impact-bar i.pos { left: 50%; background: linear-gradient(90deg, rgba(233, 169, 78, 0.45), var(--amber)); }
.impact-bar i.neg { right: 50%; background: linear-gradient(270deg, rgba(134, 171, 142, 0.45), var(--hop)); }

/* ---------------- 迁移清单 / 溯源列表 ---------------- */
.shift-list { display: flex; flex-direction: column; }
.shift-row {
  display: grid;
  grid-template-columns: 16px minmax(96px, 1fr) 62px minmax(70px, 1.1fr) 46px;
  gap: 8px;

.sh-name i { font-style: normal; font-family: var(--font-num); font-size: 9.5px; color: var(--muted-2); }

.diff-list { display: flex; flex-direction: column; gap: 3px; }

  display: grid;
  grid-template-columns: 112px minmax(0, 1fr) 70px;

/* ---------------- 因果链 ---------------- */
.chain-row {
  display: grid;

.path-line { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; color: var(--muted-2); }
.path-line b { font-weight: 400; font-family: var(--font-mono); color: var(--ink-2); font-size: 9.5px; white-space: nowrap; }

/* ---------------- 细节修正 ---------------- */

<script>
/* ============================================================
   charts.js — 轻量 SVG 图表（无外部依赖）
   ============================================================ */
(function () {
  const SHORT = {
    bitter: "苦", hop: "酒花", ester: "酯香", malt: "麦芽", roast: "焙烤", phenol: "酚香",
    sour: "酸", alcohol: "酒精", body: "酒体", sulfur: "硫", aged: "陈味", floral: "花香",
  };

  const NS = 'xmlns="http://www.w3.org/2000/svg"';

  function r1(v) { return Math.round(v * 10) / 10; }

  /* ---------- 雷达图 ---------- */
  function radar(series, opt) {
    opt = opt || {};
    const size = opt.size || 320;
    const n = opt.axes.length;
    const max = opt.max || 6;
    const cx = size / 2, cy = size / 2 + (opt.labels === false ? 0 : 2);
    const R = size * (opt.labels === false ? 0.4 : 0.315);
    const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const pt = (i, v) => [cx + Math.cos(ang(i)) * R * (v / max), cy + Math.sin(ang(i)) * R * (v / max)];
    const poly = (vals) => vals.map((v, i) => pt(i, v).map(r1).join(",")).join(" ");

    let g = "";
    // 网格
    [0.25, 0.5, 0.75, 1].forEach((f, k) => {
      const pts = Array.from({ length: n }, (_, i) => pt(i, max * f).map(r1).join(",")).join(" ");
      g += `<polygon points="${pts}" fill="none" stroke="rgba(236,223,203,${k === 3 ? 0.16 : 0.07})" stroke-width="1"/>`;
    });
    // 轴线
    for (let i = 0; i < n; i++) {
      const [x, y] = pt(i, max);
      g += `<line x1="${r1(cx)}" y1="${r1(cy)}" x2="${r1(x)}" y2="${r1(y)}" stroke="rgba(236,223,203,.07)" stroke-width="1"/>`;
    }
    // 数据
    series.forEach((s, si) => {
      if (!s.values) return;
      if (s.fill !== false) {
        g += `<polygon points="${poly(s.values)}" fill="${s.color}" fill-opacity="${s.fillOpacity == null ? 0.16 : s.fillOpacity}" stroke="none"/>`;
      }
      g += `<polygon points="${poly(s.values)}" fill="none" stroke="${s.color}" stroke-width="${s.width || 1.8}"
             stroke-linejoin="round" stroke-dasharray="${s.dash || "none"}" opacity="${s.opacity || 1}"/>`;
      if (s.dots !== false) {
        s.values.forEach((v, i) => {
          const [x, y] = pt(i, v);
          g += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${s.dotR || 2.2}" fill="${s.color}" opacity="${s.opacity || 1}"/>`;
        });
      }

      for (let i = 0; i < n; i++) {
        const [x, y] = pt(i, max * 1.19);
        const a = ang(i);
        const cos = Math.cos(a), sin = Math.sin(a);
        const anchor = Math.abs(cos) < 0.25 ? "middle" : cos > 0 ? "start" : "end";
        const dy = sin < -0.7 ? -2 : sin > 0.7 ? 8 : 3;
        const label = (opt.short !== false ? SHORT[opt.axes[i].id] : opt.axes[i].cn) || opt.axes[i].cn;
        g += `<text x="${r1(x)}" y="${r1(y + dy)}" fill="rgba(217,205,185,.72)" font-size="${opt.fontSize || 9.5}"
               text-anchor="${anchor}" font-family="var(--font-ui)">${label}</text>`;
      }

  }

  /* ---------- 迷你雷达 ---------- */
  function miniRadar(values, size, color) {
    const n = values.length, max = 6;
    const cx = size / 2, cy = size / 2, R = size * 0.42;
    const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const pt = (i, v) => [cx + Math.cos(ang(i)) * R * (v / max), cy + Math.sin(ang(i)) * R * (v / max)];
    const poly = values.map((v, i) => pt(i, v).map(r1).join(",")).join(" ");
    let g = "";
    [0.5, 1].forEach((f) => {
      g += `<polygon points="${values.map((_, i) => pt(i, max * f).map(r1).join(",")).join(" ")}"

  }

    const bw = (w - gap * (n - 1)) / n;
    let g = "";
    values.forEach((v, i) => {
      const bh = Math.max(1.6, (v / 6) * h);
      const x = i * (bw + gap);
      const op = 0.28 + 0.72 * (v / 6);
      g += `<rect x="${r1(x)}" y="${r1(h - bh)}" width="${r1(bw)}" height="${r1(bh)}" rx="1"

  }

    const w = 520, h = 172;
    const padL = 28, padR = 28;
    const x0 = opt.min, x1 = opt.max;
    const X = (v) => padL + ((v - x0) / (x1 - x0)) * (w - padL - padR);
    const base = 104;
    let g = "";

    // 目标区间带
    if (opt.targetBand) {
      const a = X(opt.targetBand[0]), b = X(opt.targetBand[1]);
      g += `<rect x="${r1(a)}" y="${base - 32}" width="${r1(b - a)}" height="32" rx="4" fill="url(#bandGrad)"/>`;
      g += `<text x="${r1((a + b) / 2)}" y="${base - 12}" fill="rgba(246,205,133,.92)" font-size="9"
             text-anchor="middle" letter-spacing=".05em">目标风格主体区间</text>`;
      g += `<line x1="${r1(a)}" y1="${base - 36}" x2="${r1(a)}" y2="${base + 5}" stroke="rgba(236,223,203,.32)" stroke-width="1" stroke-dasharray="3 3"/>`;
    }

        <path d="M0 0l7 3.5L0 7z" fill="rgba(233,169,78,.9)"/></marker></defs>`;
      g += `<line x1="${r1(a)}" y1="${base - 58}" x2="${r1(b - 3)}" y2="${base - 58}" stroke="rgba(233,169,78,.7)" stroke-width="1.1" marker-end="url(#ah)"/>`;
      g += `<circle cx="${r1(a)}" cy="${base - 58}" r="2" fill="rgba(233,169,78,.7)"/>`;
      g += `<text x="${r1((a + b) / 2)}" y="${base - 66}" fill="rgba(246,205,133,.95)" font-size="10" text-anchor="middle">所需位移 ${opt.arrow[2]}</text>`;

      g += `<line x1="${r1(x)}" y1="${base}" x2="${r1(x)}" y2="${base + 4}" stroke="rgba(236,223,203,.22)"/>`;
      g += `<text x="${r1(x)}" y="${base + 15}" fill="rgba(162,149,127,.8)" font-size="9.5" text-anchor="middle" font-family="var(--font-mono)">${v}</text>`;
    }

      const x = X(m.v);
      g += `<circle cx="${r1(x)}" cy="${base - 4}" r="3.4" fill="${m.color}" stroke="#141110" stroke-width="1"/>`;
      g += `<line x1="${r1(x)}" y1="${base - 4}" x2="${r1(x)}" y2="${base}" stroke="${m.color}" stroke-width="1.2"/>`;
      g += `<text x="${r1(x)}" y="${base + (m.row === 2 ? 58 : 38)}" fill="${m.color}" font-size="10"
             text-anchor="${m.anchor || "middle"}" font-family="var(--font-ui)">${m.label}</text>`;
    });
    return `<svg ${NS} viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">

  }

  /* ---------- 折线 / 面积 ---------- */
  function line(points, opt) {

    const w = opt.width || 300, h = opt.height || 110, pad = 6;
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);

    const y1 = opt.y1 == null ? Math.max.apply(null, ys) : opt.y1;
    const X = (v) => pad + (x1 === x0 ? 0 : ((v - x0) / (x1 - x0)) * (w - pad * 2));
    const Y = (v) => h - pad - ((v - y0) / (y1 - y0 || 1)) * (h - pad * 2);
    const d = points.map((p, i) => `${i ? "L" : "M"}${r1(X(p[0]))} ${r1(Y(p[1]))}`).join(" ");
    const area = `${d} L${r1(X(x1))} ${h - pad} L${r1(X(x0))} ${h - pad} Z`;
    const color = opt.color || "#e9a94e";
    const id = "g" + Math.random().toString(36).slice(2, 7);
    let g = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
    if (opt.grid !== false) {
      [0, 0.5, 1].forEach((f) => {
        const y = pad + f * (h - pad * 2);
        g += `<line x1="${pad}" y1="${r1(y)}" x2="${w - pad}" y2="${r1(y)}" stroke="rgba(236,223,203,.07)"/>`;
      });
    }
    g += `<path d="${area}" fill="url(#${id})"/>`;
    g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>`;
    points.forEach((p) => {
      g += `<circle cx="${r1(X(p[0]))}" cy="${r1(Y(p[1]))}" r="2.4" fill="${color}"/>`;
    });
    return `<svg ${NS} viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${g}</svg>`;
  }

  /* ---------- 环形进度 ---------- */
  function ring(percent, opt) {
    opt = opt || {};
    const size = opt.size || 74, sw = opt.stroke || 5;
    const r = (size - sw) / 2, c = 2 * Math.PI * r;
    const p = Math.max(0, Math.min(100, percent));
    return `<svg ${NS} viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(236,223,203,.09)" stroke-width="${sw}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${opt.color || "#e9a94e"}" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${r1((c * p) / 100)} ${r1(c)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="${size / 2}" y="${size / 2 + 1}" fill="${opt.color || "#f6cd85"}" font-size="${opt.fontSize || 15}"
        text-anchor="middle" dominant-baseline="middle" font-family="var(--font-num)">${Math.round(p)}</text>
    </svg>`;
  }

  /* ---------- 水平分布条（化学来源占比等） ---------- */
  function stack(items, opt) {
    opt = opt || {};
    const total = items.reduce((s, d) => s + d.v, 0) || 1;
    const w = opt.width || 520, h = opt.height || 12;
    let x = 0, g = "";
    items.forEach((d) => {
      const ww = (d.v / total) * w;
      g += `<rect x="${r1(x)}" y="0" width="${r1(Math.max(ww - 2, 1))}" height="${h}" rx="2" fill="${d.color}"/>`;
      x += ww;
    });
    return `<svg ${NS} viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${g}</svg>`;
  }

  window.Charts = { radar, miniRadar, miniBars, axisPlot, line, ring, stack, SHORT };
})();

  var queued = false;

  function norm(s) {
    s = String(s).replace(/\s+/g, " ").trim();

    (d.styles || []).forEach(function (s) { NAMES[s.cn] = s.en; });

  }

        if (wordish(v.charAt(v.length - 1)) && (wordish(t.charAt(0)) || t.charAt(0) === "—")) {

      '<svg class="rx-svg" viewBox="0 0 300 220" fill="none" aria-hidden="true">' +
        '<defs>' +
          '<clipPath id="rx-clip"><path d="' + BOTTLE + '"/></clipPath>' +
          '<radialGradient id="rx-halo" cx="0.5" cy="0.5" r="0.5">' +
            '<stop offset="0" stop-color="#e9a94e" stop-opacity=".17"/>' +
            '<stop offset="1" stop-color="#e9a94e" stop-opacity="0"/>' +
          "</radialGradient>" +
        "</defs>" +

        '<circle class="rx-halo" cx="84" cy="112" r="88" fill="url(#rx-halo)" opacity="0"/>' +
        '<ellipse cx="84" cy="196" rx="44" ry="5.5" fill="#e9a94e" opacity=".06"/>' +

        '<path d="' + BOTTLE + '" fill="rgba(236,223,203,.035)" stroke="rgba(236,223,203,.32)" stroke-width="1.6" stroke-linejoin="round"/>' +

        '<g clip-path="url(#rx-clip)">' +
          '<g class="rx-liquid">' +
            '<rect class="rx-fill" x="46" y="0" width="76" height="210" fill="#8a98a6" opacity=".9"/>' +
            '<ellipse class="rx-surface" cx="84" cy="2.4" rx="33" ry="3.4" fill="#fff" opacity=".26"/>' +
          "</g>" +
          '<g class="rx-bubble-layer"></g>' +
        "</g>" +

        '<g class="rx-label" opacity=".9">' +
          '<rect x="55" y="132" width="58" height="34" rx="2.5" fill="rgba(18,15,13,.34)" stroke="rgba(236,223,203,.2)" stroke-width="1"/>' +
          '<path d="M62 143h30M62 150h38M62 157h22" stroke="rgba(236,223,203,.26)" stroke-width="1.4" stroke-linecap="round"/>' +
        "</g>" +

        '<path d="M74 44h20" stroke="rgba(236,223,203,.45)" stroke-width="1.4" stroke-linecap="round"/>' +
        '<path d="M64 146v26" stroke="#fff" stroke-opacity=".09" stroke-width="2.6" stroke-linecap="round"/>' +

        '<g class="rx-drop" opacity="0">' +
          '<circle cx="84" cy="0" r="4.6" fill="#8a98a6"/>' +
          '<circle cx="82.5" cy="-1.6" r="1.3" fill="#fff" opacity=".5"/>' +
        "</g>" +
        '<ellipse class="rx-splash" cx="84" cy="41" rx="7" ry="2" fill="none" stroke="#fff" stroke-width="1.6" opacity="0"/>' +

        '<g transform="translate(226 118)">' +
          '<g class="rx-face">' +
            '<circle r="34" fill="#f2e3c6"/>' +
            '<circle class="rx-tint" r="34" fill="#9fb37a" opacity="0"/>' +
            EXPR +
          "</g>" +
        "</g>" +
      "</svg>"
    );
  }

  /* ---------------- 动画工具 ---------------- */
  function can(node) {
    return !REDUCE && node && node.animate;
  }

  function tweenLiquid(liq, fill, fromY, toY, fromC, toC, dur) {
    if (!liq) return;
    if (!can(liq)) {
      liq.style.transform = "translateY(" + toY + "px)";
      if (fill) fill.style.fill = toC;
      return;
    }
    var a = liq.animate(
      [{ transform: "translateY(" + fromY + "px)" }, { transform: "translateY(" + toY + "px)" }],
      { duration: dur, easing: "cubic-bezier(.25,.8,.3,1)", fill: "forwards" }
    );
    a.onfinish = function () { liq.style.transform = "translateY(" + toY + "px)"; a.cancel(); };

    if (fill && fromC !== toC) {
      var b = fill.animate([{ fill: fromC }, { fill: toC }], {
        duration: dur + 140, easing: "ease-out", fill: "forwards",
      });
      b.onfinish = function () { fill.style.fill = toC; b.cancel(); };
    } else if (fill) {
      fill.style.fill = toC;
    }
  }

  /* 从被点击的目录条目飞一滴进瓶口；返回飞行时长，跳过时返回 0 */
  function fly(svg, color, from) {
    if (REDUCE || !from) return 0;
    var box = svg.getBoundingClientRect();
    if (!box.width) return 0;
    var tx = box.left + (84 / 300) * box.width;
    var ty = box.top + (40 / 220) * box.height;
    if (ty < 8 || ty > global.innerHeight - 8 || tx < 8 || tx > global.innerWidth - 8) return 0;
    var dx = tx - from.x;
    var dy = ty - from.y;
    if (Math.abs(dx) < 48 && Math.abs(dy) < 48) return 0;

    var el = document.createElement("span");
    el.className = "rx-fly";
    el.style.left = from.x + "px";
    el.style.top = from.y + "px";
    el.style.background = color;
    el.style.boxShadow = "0 0 12px " + color;
    document.body.appendChild(el);

    var dur = 360;
    var a = el.animate(
      [
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: "translate(" + dx * 0.55 + "px," + (dy * 0.55 - 46) + "px) scale(.86)", opacity: 1, offset: 0.55 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(.42)", opacity: 0.9 },
      ],
      { duration: dur, easing: "cubic-bezier(.42,0,.58,1)", fill: "forwards" }
    );
    a.onfinish = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    /* 动画被中断时的兜底，避免残留一个点挂在页面上 */
    global.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, dur + 900);
    return dur;
  }

  function splash(svg) {
    var el = svg.querySelector(".rx-splash");
    if (!el || !can(el)) return;
    el.animate(
      [
        { transform: "scale(.35)", opacity: 0.95 },
        { transform: "scale(2.1)", opacity: 0 },
      ],
      { duration: 520, easing: "cubic-bezier(.2,.7,.4,1)" }
    );
  }

  function pour(svg, color, skipDrop) {
    if (skipDrop) { splash(svg); return; }
    var drop = svg.querySelector(".rx-drop");
    if (!drop) return;
    var dot = drop.querySelectorAll("circle");
    for (var i = 0; i < dot.length; i++) dot[i].setAttribute("fill", i ? "#fff" : color);
    drop.style.opacity = "1";

    if (!can(drop)) {
      drop.style.opacity = "0";
      return;
    }
    var a = drop.animate(
      [
        { transform: "translateY(-8px)", opacity: 0 },
        { transform: "translateY(6px)", opacity: 1, offset: 0.14 },
        { transform: "translateY(41px)", opacity: 1 },
      ],
      { duration: 460, easing: "cubic-bezier(.45,0,.9,.55)", fill: "forwards" }
    );
    a.onfinish = function () {
      drop.style.opacity = "0";
      a.cancel();
      splash(svg);
    };
  }

  function bubbles(svg, surface, delay) {
    var layer = svg.querySelector(".rx-bubble-layer");
    if (!layer || REDUCE) return;
    layer.textContent = "";
    for (var i = 0; i < 6; i++) {
      (function (i) {
        var c = document.createElementNS(SVGNS, "circle");
        var x = 62 + Math.random() * 44;
        var y = 176 + Math.random() * 8;
        var r = 1.2 + Math.random() * 1.5;
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", r.toFixed(1));
        c.setAttribute("fill", "#fff");
        c.setAttribute("opacity", "0");
        layer.appendChild(c);

        var dist = Math.max(8, y - surface - 6);
        var anim = c.animate(
          [
            { transform: "translateY(0)", opacity: 0 },
            { opacity: 0.5, offset: 0.18 },
            { transform: "translateY(-" + dist.toFixed(1) + "px)", opacity: 0 },
          ],
          {
            duration: 900 + Math.random() * 560,
            delay: delay + i * 90,
            easing: "ease-out",
            fill: "forwards",
          }
        );
        anim.onfinish = function () { if (c.parentNode) c.parentNode.removeChild(c); };
      })(i);
    }
  }

  function popHalo(svg) {
    var halo = svg.querySelector(".rx-halo");
    if (!can(halo)) return;
    halo.animate([{ opacity: 0, transform: "scale(.9)" }, { opacity: 1, offset: 0.3 }, { opacity: 0, transform: "scale(1.06)" }], {
      duration: 900, easing: "ease-out",
    });
  }

  function setTint(svg, v) {
    var t = svg.querySelector(".rx-tint");
    if (!t) return;
    if (can(t) && parseFloat(t.getAttribute("opacity") || 0) !== v) {
      t.animate([{ opacity: t.getAttribute("opacity") || 0 }, { opacity: v }], {
        duration: 320, easing: "ease-out", fill: "forwards",
      });
    }
    t.setAttribute("opacity", v);
  }

  function switchFace(svg, exs, fromIdx, toIdx) {
    var i, g;
    for (i = 0; i < exs.length; i++) {
      g = exs[i];
      if (i === toIdx) continue;
      if (i === fromIdx && can(g)) {
        var out = g.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: 130, easing: "ease-in", fill: "forwards",
        });
        out.onfinish = (function (node) {
          return function () { node.style.opacity = 0; };
        })(g);
      } else {
        g.style.opacity = 0;
      }
    }

    g = exs[toIdx];
    if (!g) return;
    g.style.opacity = 1;
    if (can(g)) {
      g.animate(
        [
          { opacity: 0, transform: "translateY(5px) scale(.9)" },
          { opacity: 1, transform: "translateY(0) scale(1)" },
        ],
        { duration: 280, easing: "cubic-bezier(.2,.9,.3,1.25)", fill: "forwards" }
      );
    }

    var face = svg.querySelector(".rx-face");
    if (can(face)) {
      if (toIdx >= 4) {
        face.animate(
          [
            { transform: "translateY(0)" },
            { transform: "translateY(-4.5px)", offset: 0.4 },
            { transform: "translateY(0)" },
          ],
          { duration: 460, easing: "ease-out" }
        );
      } else if (toIdx === 0) {
        face.animate(
          [
            { transform: "translateX(0)" },
            { transform: "translateX(-3px)", offset: 0.25 },
            { transform: "translateX(3px)", offset: 0.6 },
            { transform: "translateX(0)" },
          ],
          { duration: 400, easing: "ease-in-out" }
        );
      }
    }
    setTint(svg, toIdx === 0 ? 0.34 : toIdx === 1 ? 0.14 : 0);
  }

  function popScore(root) {
    var num = root.querySelector(".rx-num");
    if (!can(num)) return;
    num.animate(
      [
        { transform: "translateY(4px) scale(.86)", opacity: 0.2 },
        { transform: "translateY(0) scale(1.04)", opacity: 1, offset: 0.7 },
        { transform: "translateY(0) scale(1)" },
      ],
      { duration: 420, easing: "cubic-bezier(.2,.9,.3,1.1)" }
    );
    var m = root.querySelector(".rx-meter i");
    if (m && can(m)) {
      m.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], {
        duration: 520, easing: "cubic-bezier(.2,.8,.3,1)",
      });
    }
  }

  function flashChip(root) {
    var chip = root.querySelector(".rx-chip");
    if (!can(chip)) return;
    chip.animate(
      [
        { opacity: 0, transform: "translateY(-4px)" },
        { opacity: 1, transform: "translateY(0)", offset: 0.35 },
        { opacity: 1, transform: "translateY(0)", offset: 0.75 },
        { opacity: 0, transform: "translateY(-2px)" },
      ],
      { duration: 1500, easing: "ease-out", fill: "forwards" }
    );
  }

  /* ---------------- 入口 ---------------- */
  function attach(root) {
    if (!root) return;
    var stageEl = root.querySelector("[data-rx-stage]");
    if (!stageEl) return;
    var svg = stageEl.querySelector(".rx-svg");
    if (!svg) return;

    var ex = parseInt(stageEl.getAttribute("data-ex"), 10);
    var level = parseFloat(stageEl.getAttribute("data-level"));
    var color = stageEl.getAttribute("data-color") || "#8a98a6";
    var kind = stageEl.getAttribute("data-kind") || "sync";
    if (isNaN(ex)) ex = 2;
    if (isNaN(level)) level = 0.16;

    var liq = svg.querySelector(".rx-liquid");
    var fill = svg.querySelector(".rx-fill");
    var exs = svg.querySelectorAll(".rx-ex");
    var fromY = surfaceY(prev.level);
    var toY = surfaceY(level);
    var fromColor = prev.color;
    var fromEx = prev.ex;

    /* 先把画面摆回「上一次」的状态，避免重渲染造成的闪跳 */
    if (liq) liq.style.transform = "translateY(" + fromY + "px)";
    if (fill) fill.style.fill = prev.color;
    svg.style.setProperty("--rx-color", color);
    for (var i = 0; i < exs.length; i++) exs[i].style.opacity = i === prev.ex ? 1 : 0;
    setTint(svg, prev.ex === 0 ? 0.34 : prev.ex === 1 ? 0.14 : 0);

    if (!booted) {
      booted = true;
      if (liq) liq.style.transform = "translateY(" + toY + "px)";
      if (fill) fill.style.fill = color;
      for (i = 0; i < exs.length; i++) exs[i].style.opacity = i === ex ? 1 : 0;
      setTint(svg, ex === 0 ? 0.34 : ex === 1 ? 0.14 : 0);
      prev = { level: level, color: color, ex: ex };
      return;
    }

    var sameEx = ex === prev.ex;
    var gap = REDUCE ? 0 : 440;
    var lead = 0;

    if (kind === "add") {
      flashChip(root);
      popScore(root);
      var point = (stageEl.getAttribute("data-from") || "").split(",");
      if (point.length === 2) lead = fly(svg, color, { x: +point[0], y: +point[1] });
      /* 已经飞过来了，瓶口的等待可以短一些 */
      if (lead) gap = 250;
      if (lead) {
        window.setTimeout(function () { pour(svg, color, true); }, lead);
      } else {
        pour(svg, color);
      }
      window.setTimeout(function () {
        tweenLiquid(liq, fill, fromY, toY, fromColor, color, 540);
        bubbles(svg, toY, 120);
        popHalo(svg);
        if (!sameEx) switchFace(svg, exs, fromEx, ex);
      }, lead + gap);
    } else if (kind === "remove") {
      tweenLiquid(liq, fill, fromY, toY, fromColor, color, 520);
      bubbles(svg, toY, 60);
      flashChip(root);
      if (!sameEx) switchFace(svg, exs, fromEx, ex);
    } else {
      tweenLiquid(liq, fill, fromY, toY, fromColor, color, 520);
      if (!sameEx) switchFace(svg, exs, fromEx, ex);
    }

    prev = { level: level, color: color, ex: ex };
  }

  global.Reactor = { stage: stage, attach: attach };
})(window);

<script>
/* ============================================================
   app.js — 啤酒风味图谱
   ============================================================ */
(function () {
  "use strict";

  const D = window.BEER_DATA;
  const AX = D.axes;
  const AXM = Object.fromEntries(AX.map((a) => [a.id, a]));
  const CM = Object.fromEntries(D.compounds.map((c) => [c.id, c]));
  const SM = Object.fromEntries(D.styles.map((s) => [s.id, s]));
  const FAM = Object.fromEntries(D.families.map((f) => [f.id, f]));
  const GRP = Object.fromEntries(D.groups.map((g) => [g.id, g]));
  const C = window.Charts;

  const state = {
    view: "home",
    styleId: "tripel",
    detail: false,
    group: "all",
    q: "",
    sel: [],
    seed: 0,
    tab: "list",
    from: "pils",
    to: "tripel",
    rx: { id: null, kind: "sync" },
  };

  /* ================= 口味评分 ================= */
  /* 12 条感官轴的愉悦度：正值讨喜，负值劝退。个别化合物的感官描述会误导
     （双乙酰“奶油”、DMS“玉米”），用 TASTE_FIX 按常识钉住。 */
  const TASTE_VAL = {
    ester: 1, malt: 0.82, floral: 0.78, hop: 0.5, roast: 0.34, body: 0.3,
    bitter: 0.12, sour: 0.16, alcohol: 0.06, phenol: -0.12, sulfur: -1, aged: -1,
  };
  const TASTE_FIX = {
    diacetyl: 34, methanethiol: 9, acetic_acid: 24, so2: 30, iron: 20,
    t2n: 8, dms: 15, "4vg": 60, co2: 52, iso_alpha: 48, ethanol: 44, lactic_acid: 56,
  };
  const TASTE_WORD = ["难以下咽", "不太妙", "中规中矩", "不错", "很好喝"];

  function tasteScore(c) {
    if (!c) return null;
    if (TASTE_FIX[c.id] != null) return TASTE_FIX[c.id];
    let num = 0, den = 0;
    Object.keys(c.sens).forEach((k) => {
      const v = TASTE_VAL[k];
      if (v == null) return;
      num += c.sens[k] * v;
      den += c.sens[k];
    });
    return Math.round(clamp(50 + 42 * (den ? num / den : 0), 4, 96));
  }

  function tasteEx(v) {
    return v >= 72 ? 4 : v >= 58 ? 3 : v >= 42 ? 2 : v >= 26 ? 1 : 0;
  }

  /* ================= 工具 ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function conv(v, unit) {
    if (unit === "mg/L" && v >= 1000) return [v / 1000, "g/L"];
    if (unit === "µg/L" && v >= 1000) return [v / 1000, "mg/L"];
    return [v, unit];
  }
  function nf(v) {
    let s;
    if (v >= 100) s = v.toFixed(0);
    else if (v >= 10) s = v.toFixed(1);
    else s = v.toFixed(2);
    return s.replace(/\.0+$/, "").replace(/(\.\d*[1-9])0+$/, "$1");
  }
  function fmtV(v, unit) {
    const [x, u] = conv(v, unit);
    return nf(x) + " " + u;
  }
  function rangeText(lo, hi, unit) {
    const [a, ua] = conv(lo, unit);
    const [b, ub] = conv(hi, unit);
    if (lo <= 0) return "未检出 – " + nf(b) + " " + ub;
    if (ua === ub) return nf(a) + " – " + nf(b) + " " + ub;
    return nf(a) + " " + ua + " – " + nf(b) + " " + ub;
  }
  function shortRange(lo, hi, unit) {
    const [a, ua] = conv(lo, unit);
    const [b, ub] = conv(hi, unit);
    return (lo > 0 ? nf(a) : "0") + "–" + nf(b) + " " + ub;
  }

  const mid = (cid, sid) => (SM[sid] || SM[state.styleId]).values[cid][1];
  const pres = (cid, sid) => mid(cid, sid) / CM[cid].ref;
  const dev = (cid, sid) => (pres(cid, sid) - 1) * 100;

  function salience(c) {
    return Math.max.apply(null, Object.values(c.sens));
  }
  function weightOf(c, sid) {
    return c.imp * clamp(pres(c.id, sid), 0.02, 2.6) * (0.4 + salience(c));
  }
  function levelWord(d) {
    if (d > 90) return ["极显著偏高", "up"];
    if (d > 25) return ["偏高", "up"];
    if (d > -20) return ["接近基准", "flat"];
    if (d > -60) return ["偏低", "down"];
    return ["显著偏低", "down"];
  }

  function attrPills(c, n) {
    return Object.entries(c.sens)
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
      .slice(0, n || 3)
      .map(([k, v]) => {
        const nm = AXM[k] ? AXM[k].cn : k;
        return '<span class="attr-pill">' + nm + "<b>" + (v > 0 ? "+" : "") + v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "") + "</b></span>";
      })
      .join("");
  }

  function rangeBar(lo, mid_, hi, c) {
    const max = Math.max(hi * 1.18, c.ref * 1.5, 0.0001);
    const L = clamp((lo / max) * 100, 0, 100);
    const H = clamp((hi / max) * 100, 0, 100);
    const M = clamp((mid_ / max) * 100, 0, 100);
    return (
      '<div class="range"><div class="range-track">' +
      '<i class="range-fill" style="left:' + L + "%;width:" + Math.max(H - L, 1.5) + '%"></i>' +
      '<i class="range-mid" style="left:' + M + '%"></i>' +
      "</div><div class=\"range-lab\"><span>" + rangeText(lo, hi, c.unit) + "</span></div></div>"
    );
  }

  /* ================= 风格：列表 ================= */
  /* ---------------- 首页 ---------------- */
  const HOME_MODS = [
    { v: "style", n: "01", icon: "library", t: "风格查询", d: "22 个风格的关键化合物与含量区间" },
    { v: "lab", n: "02", icon: "lab", t: "化合物交互", d: "增减化合物，实时看感官轮廓怎么变" },
    { v: "note", n: "03", icon: "note", t: "口味生成", d: "把当前组合写成一段品鉴笔记" },
    { v: "origin", n: "04", icon: "origin", t: "风格溯源", d: "Tripel 的原料、工艺与化合物因果链" },
    { v: "transfer", n: "05", icon: "transfer", t: "风格迁移", d: "从一种风格改造成另一种的干预清单" },
  ];
  const HOME_GAL = ["hoppy", "stout", "kriek", "tripel"];

  function renderHome() {
    const A = window.BeerArt;
    const el = $("#view-home");

    const stats = [
      ["250", "款啤酒"],
      ["226", "项指标"],
      ["22", "个风格"],
      ["50", "维感官"],
    ]
      .map((x) => '<div class="hm-stat"><b>' + x[0] + "</b><span>" + x[1] + "</span></div>")
      .join("");

    const mods = HOME_MODS.map(
      (m) =>
        '<button class="hm-mod" data-go="' + m.v + '">' +
        '<span class="hm-mod-ico">' + A.icon(m.icon) + "</span>" +
        '<span class="hm-mod-no">' + m.n + "</span>" +
        '<span class="hm-mod-t">' + m.t + "</span>" +
        '<span class="hm-mod-d">' + m.d + "</span>" +
        '<span class="hm-mod-go" aria-hidden="true">→</span>' +
        "</button>"
    ).join("");

    const gal = HOME_GAL.map((id) => {
      const s = SM[id];
      const keys = s.key.slice(0, 2).map((k) => CM[k].cn).join(" · ");
      return (
        '<button class="hm-style" data-style="' + id + '">' +
        '<span class="hm-style-art">' + A.card(id) + "</span>" +
        '<span class="hm-style-body">' +
        '<span class="hm-style-top"><b>' + s.cn + "</b><i>" + (GRP[s.group] ? GRP[s.group].cn : "") + "</i></span>" +
        '<span class="hm-style-en">' + s.en + "</span>" +
        '<span class="hm-style-keys">' + keys + "</span>" +

  function renderStyle() {
    const el = $("#view-style");
    if (state.detail) return renderStyleDetail(el);

    const groups = D.groups.map((g) => {
      const n = g.id === "all" ? D.styles.length : D.styles.filter((s) => s.group === g.id).length;
      return (
        '<button class="chip' + (state.group === g.id ? " is-on" : "") + '" data-group="' + g.id + '">' +
        g.cn + '<span class="chip-count">' + n + "</span></button>"
      );
    }).join("");

    const list = D.styles.filter((s) => {
      if (state.group !== "all" && s.group !== state.group) return false;
      if (!state.q) return true;
      const q = state.q.toLowerCase();
      return (s.cn + s.en + s.desc + (s.alias || "")).toLowerCase().indexOf(q) >= 0;
    });

    const cards = list
      .map((s) => {
        const vals = AX.map((a) => s.profile[a.id]);
        const key = s.key.slice(0, 3).map((cid) => {
          const c = CM[cid];
          return "<span><i></i>" + c.cn + "</span>";
        }).join("");
        return (
          '<article class="s-card" data-style="' + s.id + '">' +
          '<div class="s-top"><div><div class="s-name">' + s.cn + '</div><div class="s-en">' + s.en + "</div></div>" +
          '<span class="s-fam">' + GRP[s.group].cn + "</span></div>" +
          '<div class="s-body"><div class="s-radar">' + C.miniBars(vals, 62, 34) + "</div>" +
          '<div class="s-key">' + key + "</div></div>" +
          '<div class="s-foot"><span>苦度 <b>' + s.profile.bitter.toFixed(1) + "</b> · 酯香 <b>" + s.profile.ester.toFixed(1) +
          "</b></span><span>" + (s.n ? "n=" + s.n : "n≥3") + "</span></div>" +
          "</article>"
        );
      })
      .join("");

    el.innerHTML =
      '<div class="view-head"><div class="eyebrow">01 / 风格查询 · Style library</div>' +
      "<h1>22 种风格的风味坐标<em>Flavor map</em></h1>" +
      '<p class="lede">从 250 款商业啤酒中归纳的 22 个风格，每一种都由一组化合物浓度与 50 维感官评分共同定位。' +
      "点击任一风格，查看它的<b>关键风味化合物及其含量区间</b>、感官画像与论文给出的化学指纹。</p></div>" +
      '<div class="toolbar"><div class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>' +
      '<input id="q" type="search" placeholder="搜索风格，如 IPA / 世涛 / 酸啤" value="' + state.q + '"></div>' +
      '<div class="chips">' + groups + "</div></div>" +
      '<div class="grid-styles">' + (cards || '<p class="empty-hint">没有匹配的风格，试试其他关键词。</p>') + "</div>" +
      evidencePanel();

    $("#q").addEventListener("input", (e) => {
      state.q = e.target.value;
      const pos = e.target.selectionStart;
      renderStyle();
      const q = $("#q");
      if (q) { q.focus(); q.setSelectionRange(pos, pos); }
    });
  }

  function styleListClick(e) {
    const chip = e.target.closest("[data-group]");
    if (chip) { state.group = chip.dataset.group; renderStyle(); return; }
    const card = e.target.closest("[data-style]");

  }

  function evidencePanel() {
    const rows = D.evidence
      .map((d) => {
        const t = d.top
          .map((x) => '<div class="ev-c"><b>' + x.cn + "</b><span>π " + x.pi.toFixed(2) + " · |ρ| " + x.rho.toFixed(2) + (x.relaxed ? " †" : "") + "</span></div>")
          .join("");

        return (
          '<div class="ev-row"><div class="ev-dim"><b>' + d.cn + "</b><span>" + g + " · " + d.id + "</span></div>" + t +

      '<p class="panel-note" style="margin:10px 0 14px">名单按“先以入选频率 π ≥ 0.6 筛稳定候选、再按边际效应量 |ρ| 排序”的两步规则生成；† 表示候选不足时放宽阈值的补充项。' +
      "证据等级：一级 17 维可归因到单一化合物，二级 18 维由多化合物共同承载，三级 15 维受标签侧限制。</p>" +
